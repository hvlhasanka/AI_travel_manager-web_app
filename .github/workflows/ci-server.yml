name: Server CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'Workspace/server/**'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'Workspace/server/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Workspace/server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
